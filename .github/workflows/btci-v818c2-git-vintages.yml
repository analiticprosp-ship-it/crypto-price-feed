name: BTCI v8.18c2 historical Coin Metrics git vintage comparison
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/btci_v818c2_historical_git_vintage.py'
      - '.github/workflows/btci-v818c2-git-vintages.yml'
permissions:
  contents: read
jobs:
  git-vintage-forensics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Syntax and preregistered test controls
        run: |
          python -m py_compile research/btci_v818c2_historical_git_vintage.py
          python research/btci_v818c2_historical_git_vintage.py --self-test
      - name: SHA-authenticated 2026 historical source version comparison; R2 exact readback
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python research/btci_v818c2_historical_git_vintage.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btci-v818c2-git-vintages
          path: btci_v818c2_reports/
          retention-days: 30
