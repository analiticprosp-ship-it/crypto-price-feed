name: BTCI v8.18c11 six additional original GitHub public push witnesses
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/btci_v818c11_gharchive_six_hours.py'
      - '.github/workflows/btci-v818c11-six-gharchive-hours.yml'
permissions:
  contents: read
jobs:
  historical-original-github-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Compile and test six-hour research-only historical source
        run: |
          python -m py_compile research/btci_v818c10_gharchive_push_event.py research/btci_v818c11_gharchive_six_hours.py
          python research/btci_v818c11_gharchive_six_hours.py --self-test
      - name: Audit six preregistered third-party PushEvent hours and R2 SHA readback
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python -u research/btci_v818c11_gharchive_six_hours.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btci-v818c11-independent-source-public-push
          path: btci_v818c11_reports/
          retention-days: 30
