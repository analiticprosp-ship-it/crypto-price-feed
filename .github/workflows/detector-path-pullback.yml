name: Detector SHADOW Full Path and Pullback Entries
on:
  workflow_dispatch:
    inputs:
      date:
        description: "UTC event date"
        required: true
        default: "2026-10-16"
        type: string
permissions:
  contents: read
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Analyze 5m price paths and counter-signal pullback entries
        env:
          DATE: ${{ inputs.date }}
        run: python research/detector_path_pullback_v01.py --date "$DATE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detector-path-pullback-results
          path: detector_path_pullback_results/
          retention-days: 30
