name: Detector H1-H10 Metrics 413-Day Source Lineage Audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/detector-h1h10-metrics-413day-lineage.yml'
      - 'research/detector_metrics_413day_source_lineage.py'
      - 'research/test_detector_metrics_413day_source_lineage.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Validate exact raw and sorted OI value lineage and timezone safeguards
        run: python -m unittest -v research.test_detector_metrics_413day_source_lineage
      - name: Read raw Binance metrics and masked/sorted ZIPs with SHA CRC and compare full numeric OI labels
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python -m research.detector_metrics_413day_source_lineage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detector-413day-metrics-source-lineage
          path: detector_metrics_413day_provenance/report.json
          retention-days: 30
          if-no-files-found: warn
