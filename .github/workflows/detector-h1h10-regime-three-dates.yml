name: H1H10 Three Frozen Prior BTC Regime Dates
on:
  push:
    branches: [main]
    paths:
      - 'research/detector_h1h10_regime_prewindow_three_dates.py'
      - 'research/test_detector_h1h10_regime_prewindow_three_dates.py'
      - '.github/workflows/detector-h1h10-regime-three-dates.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: h1h10-three-preholdout-regime-sample
  cancel-in-progress: false
jobs:
  independent-day:
    name: Exploratory prior-week BTC regime ${{ matrix.day }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        day: ['2026-02-18','2026-04-15','2026-06-17']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Verify frozen prehistory, original event timestamps, bounded source and no holdout
        run: python -m unittest -v research.test_detector_h1h10_regime_prewindow_three_dates research.test_detector_h1h10_binance_week_event_expansion research.test_detector_h1h10_binance_aggtrades_first_verified research.test_detector_h1h10_binance_one_day_event_diagnostics
      - name: Verify BTC prior-seven-day price and ETH SOL Spot Perp 5m event archives into SHA-pinned R2
        env:
          H1H10_RESEARCH_DAY: ${{ matrix.day }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python -m research.detector_h1h10_regime_prewindow_three_dates
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h1h10-three-regime-event-${{ matrix.day }}
          path: detector_h1h10_regime_three_dates/${{ matrix.day }}.json
          retention-days: 30
          if-no-files-found: warn
