name: Detector Historical Source Recovery v2.3
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe Bybit historical OI and record gated alternative sources
        run: python research/detector_source_recovery_v23.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detector-source-recovery-v23-results
          path: detector_source_recovery_v23_results/
          retention-days: 30
