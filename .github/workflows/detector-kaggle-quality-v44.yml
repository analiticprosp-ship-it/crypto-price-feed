name: Detector Kaggle Quality v4.4
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python research/detector_kaggle_parity_v44.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detector-kaggle-quality-v44-results
          path: detector_kaggle_parity_v44_results/
          retention-days: 30
