name: Detector H1-H10 Evidence-Based R2 Source Inventory
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/detector-h1h10-evidence-source-inventory.yml'
      - 'research/detector_h1h10_verified_source_inventory.py'
      - 'research/test_detector_h1h10_verified_source_inventory.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Test event-vs-receipt semantics and gaps with deliberate bad data
        run: python -m unittest -v research.test_detector_h1h10_verified_source_inventory
      - name: Read pinned SHA-verified OI and price, archived event-only Binance flow, and actual OKX prospective run reports
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python -m research.detector_h1h10_verified_source_inventory
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detector-h1h10-source-evidence-inventory
          path: |
            detector_h1h10_evidence_inventory/inventory.json
            detector_h1h10_evidence_inventory/inventory.csv
          if-no-files-found: warn
          retention-days: 30
