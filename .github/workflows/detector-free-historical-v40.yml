name: Detector Free Historical Sources v4.0
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python research/detector_free_historical_v40.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detector-free-historical-v40-results
          path: detector_free_historical_v40_results/
          retention-days: 30
