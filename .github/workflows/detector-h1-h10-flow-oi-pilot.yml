name: Detector H1-H10 OI Semantics and Trade Flow Pilot
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/detector-h1-h10-flow-oi-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: detector-h1-h10-masked-sorted-dataset
          run-id: 39064403741
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: detector_h1_h10_masked_sorted
      - name: Check OI unit plausibility and trade archive accessibility
        run: python research/detector_h1_h10_flow_oi_pilot.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detector-h1-h10-flow-oi-pilot-report
          path: detector_h1_h10_flow_oi_pilot/
          retention-days: 30
