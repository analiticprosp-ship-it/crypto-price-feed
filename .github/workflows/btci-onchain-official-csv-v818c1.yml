name: BTCI official Coin Metrics free archive source audit v8.18c1
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/btci_onchain_official_csv_v818c1.py'
      - '.github/workflows/btci-onchain-official-csv-v818c1.yml'
permissions:
  contents: read
jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Verify official CoinMetrics public CSV against SHA1 original blob and inspect retrospective network metric fields
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python research/btci_onchain_official_csv_v818c1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btci-v818c1-official-coinmetrics-csv-audit
          path: btci_v818c1_reports/
          retention-days: 30
