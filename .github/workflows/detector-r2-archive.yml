name: Detector H1-H10 Research R2 Archive
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/detector-r2-archive.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: detector-h1-h10-r2-archive
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Archive approved H1-H10 research to existing private R2
        env:
          GH_READ_TOKEN: ${{ github.token }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python research/detector_r2_archive.py
