name: H1H10 One Day Event Only Diagnostics Offline Guard
on:
  pull_request:
    paths:
      - 'research/detector_h1h10_binance_one_day_event_diagnostics.py'
      - 'research/test_detector_h1h10_binance_one_day_event_diagnostics.py'
      - '.github/workflows/detector-h1h10-one-day-event-diagnostics.yml'
      - '.github/workflows/detector-h1h10-one-day-event-pr.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Check no source-label to historical PIT promotion, exact one-day future censor and H6 matched pairs
        run: python -m unittest -v research.test_detector_h1h10_binance_one_day_event_diagnostics
