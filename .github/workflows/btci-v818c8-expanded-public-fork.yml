name: BTCI v8.18c8 expanded public fork MVRV source witnesses
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/btci_v818c8_expanded_public_fork_pit.py'
      - '.github/workflows/btci-v818c8-expanded-public-fork.yml'
permissions:
  contents: read
jobs:
  source-witnesses:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install R2 archival client
        run: python -m pip install 'boto3>=1.35,<2'
      - name: Compile and run source/PIT guard tests
        run: |
          python -m py_compile research/btci_v818c8_expanded_public_fork_pit.py
          python research/btci_v818c8_expanded_public_fork_pit.py --self-test
      - name: Verify 13 archived GitHub forks and replay 684 Sundays with R2 SHA readback
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python research/btci_v818c8_expanded_public_fork_pit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btci-v818c8-expanded-historical-fork-asof
          path: btci_v818c8_reports/
          retention-days: 30
