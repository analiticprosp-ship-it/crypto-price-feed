name: Detector Tardis Alignment v2.8
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python research/detector_tardis_alignment_v28.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detector-tardis-alignment-v28-results
          path: detector_tardis_alignment_v28_results/
          retention-days: 30
