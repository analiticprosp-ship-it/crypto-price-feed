name: BTCI independent Fed rates and dollar vintage audit v8.18a
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/btci_independent_rate_dollar_audit_v818a.py'
      - '.github/workflows/btci-independent-rates-dollar-source-v818a.yml'
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Verify historical FRED original-vintage real rate broad dollar and yield curve records
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python research/btci_independent_rate_dollar_audit_v818a.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btci-v818a-independent-factor-vintage-audit
          path: btci_v818a_reports/
          retention-days: 30
