name: P3 Tardis source coverage (research only)
on:
  push:
    branches: [research/p3-infra-crises-20261101]
    paths:
      - .github/workflows/p3-tardis-coverage-20261108.yml
      - research/p3-infra-crises-20261101/continuation_20261108/probe_tardis_coverage.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python research/p3-infra-crises-20261101/continuation_20261108/probe_tardis_coverage.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p3-tardis-source-metadata
          path: /tmp/p3-source-catalog/tardis_exchange_metadata.json
          retention-days: 60
