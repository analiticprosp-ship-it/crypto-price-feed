name: Detector Taker Units v3.4
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python research/detector_taker_units_v34.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detector-taker-units-v34-results
          path: detector_taker_units_v34_results/
          retention-days: 30
