name: H1H10 Falling Prior BTC Regime Offline Guard
on:
  pull_request:
    paths:
      - 'research/detector_h1h10_find_falling_prior_btc_candidate.py'
      - 'research/test_detector_h1h10_find_falling_prior_btc_candidate.py'
      - '.github/workflows/detector-h1h10-first-falling-btc-discovery.yml'
      - '.github/workflows/detector-h1h10-first-falling-btc-discovery-pr.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Verify deterministic earliest falling from prior prices only, missing-source stop
        run: python -m unittest -v research.test_detector_h1h10_find_falling_prior_btc_candidate
