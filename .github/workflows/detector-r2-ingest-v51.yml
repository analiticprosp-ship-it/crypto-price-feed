name: Detector historical R2 ingestion v5.1
on:
  workflow_dispatch:
    inputs:
      batch:
        description: 'Batch number (0-98, 36 months per batch)'
        required: true
        default: '11'
permissions:
  contents: read
concurrency:
  group: detector-r2-ingest-v51
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Download, validate and persist monthly ZIPs
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python research/detector_r2_ingest_v51.py --batch "${{ inputs.batch }}" --batch-size 36 --workers 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detector-r2-ingest-v51-report-${{ inputs.batch }}
          path: r2_ingest_report/
          retention-days: 30
