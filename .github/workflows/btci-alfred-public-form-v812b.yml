name: BTCI ALFRED public vintage download pilot v8.12b
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/btci_alfred_public_form_pilot_v812b.py'
      - '.github/workflows/btci-alfred-public-form-v812b.yml'
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'boto3>=1.35,<2' 'beautifulsoup4>=4.12,<5'
      - name: Test official no-key ALFRED historical vintage download form with source validation
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python research/btci_alfred_public_form_pilot_v812b.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btci-v812b-alfred-public-form-pilot
          path: btci_v812b_reports/
          retention-days: 30
