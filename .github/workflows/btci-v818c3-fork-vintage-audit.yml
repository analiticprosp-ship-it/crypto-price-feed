name: BTCI v8.18c3 verify historic Coin Metrics fork Git vintages
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/btci_v818c3_historical_fork_pit.py'
      - '.github/workflows/btci-v818c3-fork-vintage-audit.yml'
permissions:
  contents: read
jobs:
  historic-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Compile and validate audit logic
        run: |
          python -m py_compile research/btci_v818c3_historical_fork_pit.py
          python research/btci_v818c3_historical_fork_pit.py --self-test
      - name: Audit pinned source files and write readback-verified R2 research report
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python research/btci_v818c3_historical_fork_pit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btci-v818c3-historic-git-vintage-audit
          path: btci_v818c3_reports/
          retention-days: 30
