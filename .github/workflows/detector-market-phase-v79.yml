name: Detector BTC market phase diagnostic v7.9
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/detector_market_phase_v79.py'
      - '.github/workflows/detector-market-phase-v79.yml'
permissions:
  contents: read
concurrency:
  group: detector-research-v79-regime
  cancel-in-progress: false
jobs:
  historic-plus-current:
    strategy:
      fail-fast: false
      matrix:
        asset: [BTC, ETH, SOL, BNB, LINK, XRP, ADA, DOGE]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Validate complete historical archive plus completed Oct UTC days
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python research/detector_market_phase_v79.py --asset ${{ matrix.asset }}
      - name: Save per-asset audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detector-v79-${{ matrix.asset }}
          path: detector_v79_reports/
          retention-days: 30
  phase-diagnostic:
    needs: historic-plus-current
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Join synchronized closed prices and calculate research phase
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python research/detector_market_phase_v79.py --combine
      - name: Upload market phase report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detector-v79-price-phase-report
          path: detector_v79_reports/
          retention-days: 30
