name: Detector Reconstructed Probe v3.6
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python research/detector_reconstruction_v36.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detector-reconstruction-v36-results
          path: detector_reconstruction_v36_results/
          retention-days: 30
