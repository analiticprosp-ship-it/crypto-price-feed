name: Detector post-hoc nonoverlap v7.2
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/detector_nonoverlap_v72.py'
      - '.github/workflows/detector-nonoverlap-v72.yml'
permissions:
  contents: read
concurrency:
  group: detector-research-v72
  cancel-in-progress: false
jobs:
  nonoverlap-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install R2 client
        run: python -m pip install boto3
      - name: Verify immutable reports and replay nonoverlapping first LONG events
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python research/detector_nonoverlap_v72.py
      - name: Upload historical audit copy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detector-v72-nonoverlap-audit
          path: detector_v72_reports/
          retention-days: 30
