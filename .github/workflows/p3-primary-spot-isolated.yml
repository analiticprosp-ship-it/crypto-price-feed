name: P3 isolated primary SPOT historical collection
on:
  push:
    branches: [research/p3-infra-crises-20261101]
    paths:
      - research/p3-infra-crises-20261101/collect_primary_spot.py
      - .github/workflows/p3-primary-spot-isolated.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: p3-primary-spot-isolated
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == 'refs/heads/research/p3-infra-crises-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Validate read-only candle guards
        run: |
          python -m py_compile research/p3-infra-crises-20261101/collect_primary_spot.py
          python -c "import runpy; assert runpy.run_path('research/p3-infra-crises-20261101/collect_primary_spot.py')['selftest']()"
      - name: Collect five registered episodes into isolated P3 paths
        run: python -u research/p3-infra-crises-20261101/collect_primary_spot.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p3-primary-spot-evidence
          path: research/p3-infra-crises-20261101/spot_runs
          retention-days: 30
      - name: Persist only isolated P3 raw research data
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/research/p3-infra-crises-20261101'
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/p3-infra-crises-20261101/spot_runs
          if git diff --cached --quiet; then exit 0; fi
          test "$(git diff --cached --name-only | grep -Ev '^research/p3-infra-crises-20261101/spot_runs/.+\.(json)$' | wc -l)" -eq 0
          git commit -m 'research(P3): archive primary SPOT event evidence, no trading changes'
          git push origin HEAD:research/p3-infra-crises-20261101
