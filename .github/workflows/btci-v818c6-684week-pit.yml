name: BTCI v8.18c6 immutable 684-week MVRV PIT eligibility audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/btci_v818c6_684week_mvrv_pit_eligibility.py'
      - '.github/workflows/btci-v818c6-684week-pit.yml'
permissions:
  contents: read
jobs:
  pit-eligibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Compile and test strict PIT gating
        run: |
          python -m py_compile research/btci_v818c6_684week_mvrv_pit_eligibility.py
          python research/btci_v818c6_684week_mvrv_pit_eligibility.py --self-test
      - name: Audit exact 684 parent BTC Sundays and SHA pinned historical MVRV originals
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python research/btci_v818c6_684week_mvrv_pit_eligibility.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btci-v818c6-684week-pit-eligibility
          path: btci_v818c6_reports/
          retention-days: 30
