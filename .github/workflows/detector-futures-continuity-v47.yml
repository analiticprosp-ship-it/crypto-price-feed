name: Detector Futures Continuity v4.7
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python research/detector_futures_contiguous_v47.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detector-futures-continuity-v47-report
          path: detector_futures_contiguous_v47_results/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detector-futures-continuity-v47-data
          path: detector_futures_contiguous_v47_data/
          compression-level: 0
          retention-days: 30
