name: Detector H1-H10 Tardis Four-Day Independent Causality Audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/detector-tardis-fourday-independent-audit.yml'
      - 'research/detector_tardis_fourday_independent_audit.py'
      - 'research/test_detector_tardis_fourday_independent_audit.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Prove independent as-of replay catches tampering and timing violations
        run: python -m unittest -v research.test_detector_tardis_fourday_independent_audit
      - name: Independently recompute Tardis OI source selection for all 3456 historical 5m buckets
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python research/detector_tardis_fourday_independent_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detector-tardis-fourday-independent-replay-report
          path: detector_tardis_fourday_verify/report.json
          retention-days: 30
          if-no-files-found: warn
