name: Detector Perp Coverage v3.8.1
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python research/detector_perp_coverage_v381.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detector-perp-coverage-v381-results
          path: detector_perp_coverage_v381_results/
          retention-days: 30
