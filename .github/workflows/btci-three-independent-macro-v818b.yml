name: BTCI historical independent US rates dollar curve v8.18b
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/btci_three_factor_asof_v818b.py'
      - '.github/workflows/btci-three-independent-macro-v818b.yml'
permissions:
  contents: read
jobs:
  historical-macro:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Audit exact FRED as-of-Sunday US real rates broad USD and yield curve and BTC rise/drop incidence on matched histories
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python research/btci_three_factor_asof_v818b.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btci-v818b-independent-macro-factor-pit
          path: btci_v818b_reports/
          retention-days: 30
