name: Detector SHADOW Multi-Day Coverage Audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit original first-detection timestamps in Git history
        run: python research/detector_multiday_audit_v12.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detector-multiday-audit-results
          path: detector_multiday_audit_results/
          retention-days: 30
