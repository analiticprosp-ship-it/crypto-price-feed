name: Detector H1-H10 OKX OI 48h Forward Availability Pilot
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/detector-okx-oi-48h-pilot.yml'
      - 'research/detector_okx_oi_48h_pilot.py'
      - 'research/test_detector_okx_oi_48h_pilot.py'
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: read
  actions: write  # Only for self-disabling this standalone research workflow after 48h
concurrency:
  group: detector-okx-oi-48h-forward-pilot
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Validate as-of first-seen bounds offline
        run: python -m unittest -v research.test_detector_okx_oi_48h_pilot
      - name: Capture OKX BTC ETH SOL 5m OI and verify R2; self-disable after 48 hours
        env:
          GH_TOKEN: ${{ github.token }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python research/detector_okx_oi_48h_pilot.py
