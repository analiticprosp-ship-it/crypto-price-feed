name: BTCI full history macro early rise fall research v8.17
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/btci_full_macro_btc_v817.py'
      - '.github/workflows/btci-full-macro-upside-downside-v817.yml'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Audit original Sunday vintages and BTC large up/down outcomes over entire eligible historical period
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python research/btci_full_macro_btc_v817.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btci-v817-long-btc-macro-up-down-full
          path: btci_v817_reports/
          retention-days: 30
