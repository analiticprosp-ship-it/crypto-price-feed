name: P3 Kraken corrected discovery (research only)
on:
  push:
    branches: [research/p3-infra-crises-20261101]
    paths:
      - .github/workflows/p3-kraken-corrected-20261108.yml
      - research/p3-infra-crises-20261101/continuation_20261108/probe_kraken_corrected.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kraken-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Probe documented v1 paths and Kraken symbol variants
        env:
          CRYPTOHFTDATA_API_KEY: ${{ secrets.CRYPTOHFTDATA_API_KEY }}
        run: python research/p3-infra-crises-20261101/continuation_20261108/probe_kraken_corrected.py --out /tmp/p3-kraken
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p3-kraken-discovery-manifest
          path: /tmp/p3-kraken/discovery_manifest.json
          retention-days: 60
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p3-kraken-discovery-raw
          path: /tmp/p3-kraken/*.parquet
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
