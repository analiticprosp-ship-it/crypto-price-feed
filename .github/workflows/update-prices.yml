name: Update critical crypto prices
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/refresh-now.txt'
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
concurrency:
  group: crypto-price-feed-core
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Publish core independently from research
        run: python scripts/update_core_prices.py
      - name: Commit only core prices
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prices.json
          git diff --cached --quiet && exit 0
          git commit -m 'Update critical crypto quotes'
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 3
          done
          exit 1
