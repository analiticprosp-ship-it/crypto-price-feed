name: Update crypto prices
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
concurrency:
  group: crypto-price-feed
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Fetch core prices and nonblocking monitored quotes
        shell: python
        run: |
          import json, urllib.request, urllib.parse
          from datetime import datetime,timezone
          from pathlib import Path
          base='https://crypto-price-gateway.vercel.app'
          now=datetime.now(timezone.utc)
          u=json.loads(Path('universe.json').read_text())
          def batch(symbols,market):
              url=base+'/batch?'+urllib.parse.urlencode({'symbols':','.join(symbols),'market':market})
              req=urllib.request.Request(url,headers={'Accept':'application/json','User-Agent':'crypto-price-feed/2.0'})
              with urllib.request.urlopen(req,timeout=20) as r:
                  if r.status!=200: raise RuntimeError('status '+str(r.status))
                  return json.load(r)
          # Contract-preserving original core always requested first, never block it on research tickers.
          spot=batch(u['spot_core'],'spot')
          perp=batch(['BTC','ETH','SOL','XRP','HYPE'],'perp')
          if not spot.get('ok') or not perp.get('ok'):
              raise RuntimeError('Core quote feed failed; retain previous prices.json')
          # Priority and market listing. Additional symbols are optional; no alias guessing.
          groups=['P0']
          if now.minute<5: groups.append('P1')
          if now.minute<5 and now.hour%4==0: groups.append('P2')
          supplementalSpot=list(dict.fromkeys(s for group in groups for s in u['priority'][group]
              if s not in u['spot_core'] and s not in u['groups']['stablecoins_metrics_only']))
          supplementalPerp=list(dict.fromkeys(s for s in u['perpetual_core']+u['groups']['futures_extended']
              if s not in ['BTC','ETH','SOL','XRP','HYPE']))
          failures={'spot':{},'perpetual':{}}
          # Isolate failures, preserve core contract and all valid quotes.
          for market,extra,target in [('spot',supplementalSpot,spot),('perp',supplementalPerp,perp)]:
              present={q.get('symbol') for q in target.get('quotes',[])}
              for symbol in extra:
                  if symbol in present: continue
                  try:
                      obj=batch([symbol],market)
                      qs=[q for q in obj.get('quotes',[]) if q.get('symbol')==symbol and q.get('ok') is True and isinstance(q.get('systemPrice'),(int,float))]
                      if qs:
                          target['quotes'].extend(qs);present.add(symbol)
                      else: failures['spot' if market=='spot' else 'perpetual'][symbol]='N/A: exact quote unavailable'
                  except Exception as ex: failures['spot' if market=='spot' else 'perpetual'][symbol]=str(ex)[:100]
          payload={'generatedAt':now.isoformat(),'source':base,
              'protocol':{'venues':['MEXC','OKX','Bybit'],'price':'mid=(bid+ask)/2',
              'rule':'3 fresh -> mean_3; 2 fresh -> mean_2; <2 -> OKX; spread >0.7% -> OKX',
              'freshnessSeconds':15,'spreadLimitPct':0.7,'universe':'universe.json',
              'researchQuoteFailuresAreNotZero':True},'spot':spot,'perpetual':perp,
              'optionalAvailability':failures}
          Path('prices.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n')
          print('Updated core; extra Spot',len(supplementalSpot),'extra Perp',len(supplementalPerp))
      - name: Commit only quote snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prices.json
          git diff --cached --quiet && exit 0
          git commit -m 'Update crypto quotes'
          git pull --rebase origin main
          git push origin HEAD:main
