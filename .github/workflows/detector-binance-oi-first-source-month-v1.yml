name: Detector H1-H10 Binance First OI Source Month Recon
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/detector-binance-oi-first-source-month-v1.yml'
      - 'research/detector_binance_oi_origin_month_recon_v1.py'
      - 'research/test_detector_binance_oi_origin_month_recon_v1.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  origin:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check original publication claims fail closed
        run: python -m unittest -v research.test_detector_binance_oi_origin_month_recon_v1
      - name: Install minimal R2 client
        run: python -m pip install 'boto3>=1.35,<2'
      - name: Probe 2020-2021 source dates and verify publisher SHA of first evidence
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python -m research.detector_binance_oi_origin_month_recon_v1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detector-binance-oi-origin-month-recon-v1
          path: detector_binance_oi_early_origin/report.json
          retention-days: 30
