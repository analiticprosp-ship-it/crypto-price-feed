name: H1H10 First Falling BTC Prior Regime Discovery
on:
  push:
    branches: [main]
    paths:
      - 'research/detector_h1h10_find_falling_prior_btc_candidate.py'
      - 'research/test_detector_h1h10_find_falling_prior_btc_candidate.py'
      - '.github/workflows/detector-h1h10-first-falling-btc-discovery.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: h1h10-first-falling-prehistory-bounded
  cancel-in-progress: false
jobs:
  fixed-candidate-price-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Test first-falling selection no source skip or future leakage
        run: python -m unittest -v research.test_detector_h1h10_find_falling_prior_btc_candidate
      - name: Verify only prior-week original BTC Spot prices and record earliest falling discovery date
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python -m research.detector_h1h10_find_falling_prior_btc_candidate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h1h10-btc-priorweek-first-falling-candidate
          path: detector_h1h10_falling_regime_selection/report.json
          retention-days: 30
          if-no-files-found: warn
