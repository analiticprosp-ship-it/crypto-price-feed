name: BTCI historical Binance BTCUSDT crisis turnover v8.18f
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/btci_crypto_volume_event_v818f.py'
      - '.github/workflows/btci-crisis-spot-volume-v818f.yml'
permissions:
  contents: read
jobs:
  volume:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Validate official Binance BTCUSDT daily spot turnover and taker side crisis comparisons
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python research/btci_crypto_volume_event_v818f.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btci-v818f-binance-crisis-volume-data
          path: btci_v818f_reports/
          retention-days: 30
