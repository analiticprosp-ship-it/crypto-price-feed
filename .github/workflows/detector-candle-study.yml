name: Detector Candle Continuation Study
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candle-study:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: python -m pip install requests pandas numpy
      - name: Run independent OHLCV study
        run: |
          python research/detector_candle_study_v0_1.py \
            --days 10 \
            --symbols BTC ETH SOL XRP HYPE LINK LDO SUI AAVE \
            --out detector_study_results
      - name: Upload research data and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detector-candle-study-results
          path: detector_study_results/
          if-no-files-found: warn
          retention-days: 30
