name: Detector forward price outcomes v6.4
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  forward-outcomes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'boto3>=1.35,<2'
      - name: Measure future price outcomes of historical shadow LONGs
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python research/detector_forward_outcomes_v64.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detector-v64-forward-outcomes
          path: detector_v64_reports/
          retention-days: 30
