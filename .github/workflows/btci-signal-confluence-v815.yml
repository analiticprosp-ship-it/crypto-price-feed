name: BTCI multi-indicator confluence episode research v8.15
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/btci_signal_confluence_v815.py'
      - '.github/workflows/btci-signal-confluence-v815.yml'
permissions:
  contents: read
jobs:
  confluence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Compare preregistered independent-family BTC-Fed-NFCI-ANFCI confluence and time sequences
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python research/btci_signal_confluence_v815.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btci-v815-composite-confirmation-episodes
          path: btci_v815_reports/
          retention-days: 30
