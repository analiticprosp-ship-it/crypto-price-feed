name: Detector H1-H10 Live OI Availability Research
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/detector-h1-h10-oi-availability.yml'
      - 'research/detector_h1_h10_oi_availability_poll.py'
      - 'research/test_detector_h1_h10_oi_availability_poll.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: detector-h1-h10-oi-first-observed
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Validate timing bounds and fail-closed rules
        run: python -m unittest -v research.test_detector_h1_h10_oi_availability_poll
      - name: Poll BTC ETH SOL OI and verify private R2 persistence
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python research/detector_h1_h10_oi_availability_poll.py
