name: BTCI v818b FRED batch vintage source probe
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/btci_v818b_batch_format_probe.py'
      - '.github/workflows/btci-v818b-batch-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Confirm original FRED multi-vintage as-of Sunday source schema
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python research/btci_v818b_batch_format_probe.py
