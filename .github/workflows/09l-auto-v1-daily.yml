name: "09L AUTO v1.1 daily source audits and no-lookahead label archive (NO TRADING)"
on:
  push:
    branches: [main]
    paths: [.github/workflows/09l-auto-v1-daily.yml]
  schedule:
    - cron: "47 8 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: 09l-auto-v1-daily-research-only
  cancel-in-progress: false
jobs:
  provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: "Checkout isolated research ref, not main"
        uses: actions/checkout@v4
        with:
          ref: research/09l-v089-historical-robustness-20261027
          persist-credentials: false
      - name: "Compile and run exact historical QA selftest"
        run: |
          python -m py_compile research/09l/auto/v1/collector.py research/09l/auto/v1/no_lookahead_v087.py research/09l/auto/v1/health_report.py
          python -u research/09l/auto/v1/collector.py --mode selftest
      - name: "Append monthly FREE first-day-of-month data provenance and PIT missingness"
        # No CoinGlass API secrets are passed to this publicly scheduled research-only job.
        run: python -u research/09l/auto/v1/collector.py --mode daily
      - name: "Register monthly no-lookahead v0.8.7 research observations (no model fitting)"
        run: |
          python research/09l/auto/v1/no_lookahead_v087.py --selftest
          python -u research/09l/auto/v1/no_lookahead_v087.py --study bybit_latest
          python -u research/09l/auto/v1/no_lookahead_v087.py --study okx_latest
      - name: "Collect first observed BTC liquidation outcome proxies for the next available free monthly day (RESEARCH ONLY)"
        run: |
          python -m py_compile research/09l/v0.8.8-2026-10-23/first_liquidation_event_behaviour.py research/09l/v0.8.8-2026-10-23/r2_archive_v088.py
          python research/09l/v0.8.8-2026-10-23/first_liquidation_event_behaviour.py --selftest
          python -u research/09l/v0.8.8-2026-10-23/first_liquidation_event_behaviour.py --study bybit_latest
          python -u research/09l/v0.8.8-2026-10-23/first_liquidation_event_behaviour.py --study okx_latest
      - name: "Archive verified historical label cohorts in EXISTING private Cloudflare R2 with SHA readback"
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          python -m pip install --quiet boto3
          python research/09l/auto/v1/r2_archive_v087.py --selftest
          python -u research/09l/auto/v1/r2_archive_v087.py --all-available
      - name: "Archive observed liquidation behaviour source receipts into EXISTING private R2"
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python -u research/09l/v0.8.8-2026-10-23/r2_archive_v088.py --all-available
      - name: "Publish daily data-health report with explicit missingness"
        run: |
          python research/09l/auto/v1/health_report.py --selftest
          python -u research/09l/auto/v1/health_report.py
      - name: "Archive audit artifact only; no raw vendor data"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 09l-auto-daily-research-audit
          path: |
            research/09l/auto/v1/derived/monthly/*.json
            research/09l/auto/v1/derived/runs/*.json
            research/09l/auto/v1/derived/v087_labels/**/*.json
            research/09l/auto/v1/derived/health/*.json
            research/09l/auto/v1/derived/r2_receipts/*.json
            research/09l/v0.8.8-2026-10-23/derived/liquidation_event_proxies/**/*.json
            research/09l/v0.8.8-2026-10-23/derived/r2/*.json
          retention-days: 30
          if-no-files-found: warn
      - name: "Writeback strictly under research/09l/auto/v1/derived to research branch ONLY"
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "research/09l-v089-historical-robustness-20261027"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/09l/auto/v1/derived research/09l/v0.8.8-2026-10-23/derived/liquidation_event_proxies research/09l/v0.8.8-2026-10-23/derived/r2
          if git diff --cached --quiet; then echo "Idempotent/no new artifacts"; exit 0; fi
          if git diff --cached --name-only | grep -Ev '^research/09l/(auto/v1/derived/|v0.8.8-2026-10-23/derived/(liquidation_event_proxies/|r2/))'; then
            echo "UNAUTHORIZED_PATH_IN_WRITEBACK" >&2
            exit 1
          fi
          git commit -m "research(09L AUTO): append daily source provenance, quality and PIT status"
          git pull --rebase origin research/09l-v089-historical-robustness-20261027
          B64="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${B64}" push origin HEAD:research/09l-v089-historical-robustness-20261027
