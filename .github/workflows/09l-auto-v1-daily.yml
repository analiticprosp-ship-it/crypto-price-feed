name: "09L AUTO v1.0 daily historical research metadata (NO TRADING)"
on:
  push:
    branches: [main]
    paths: [.github/workflows/09l-auto-v1-daily.yml]
  schedule:
    - cron: "47 8 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: 09l-auto-v1-daily-research-only
  cancel-in-progress: false
jobs:
  provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: "Checkout isolated research ref, not main"
        uses: actions/checkout@v4
        with:
          ref: research/09l-auto-v1-20261022
          persist-credentials: false
      - name: "Compile and run exact historical QA selftest"
        run: |
          python -m py_compile research/09l/auto/v1/collector.py
          python -u research/09l/auto/v1/collector.py --mode selftest
      - name: "Append monthly FREE first-day-of-month data provenance and PIT missingness"
        # No CoinGlass API secrets are passed to this publicly scheduled research-only job.
        run: python -u research/09l/auto/v1/collector.py --mode daily
      - name: "Archive audit artifact only; no raw vendor data"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 09l-auto-daily-research-audit
          path: |
            research/09l/auto/v1/derived/monthly/*.json
            research/09l/auto/v1/derived/runs/*.json
          retention-days: 30
          if-no-files-found: warn
      - name: "Writeback strictly under research/09l/auto/v1/derived to research branch ONLY"
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "research/09l-auto-v1-20261022"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/09l/auto/v1/derived
          if git diff --cached --quiet; then echo "Idempotent/no new artifacts"; exit 0; fi
          if git diff --cached --name-only | grep -Ev '^research/09l/auto/v1/derived/'; then
            echo "UNAUTHORIZED_PATH_IN_WRITEBACK" >&2
            exit 1
          fi
          git commit -m "research(09L AUTO): append daily source provenance, quality and PIT status"
          git pull --rebase origin research/09l-auto-v1-20261022
          B64="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${B64}" push origin HEAD:research/09l-auto-v1-20261022
