name: Detector Tardis Value Audit v2.6
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  values:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python research/detector_tardis_values_v26.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detector-tardis-values-v26-results
          path: detector_tardis_values_v26_results/
          retention-days: 30
