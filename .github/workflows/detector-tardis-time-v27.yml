name: Detector Tardis Timestamp Audit v2.7
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  timestamp:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python research/detector_tardis_time_v27.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detector-tardis-time-v27-results
          path: detector_tardis_time_v27_results/
          retention-days: 30
