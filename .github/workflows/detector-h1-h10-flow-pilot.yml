name: Detector H1-H10 flow pilot
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flow-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate archived spot/perp aggTrades flow
        run: python research/detector_h1_h10_flow_pilot.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detector-h1-h10-flow-validation
          path: detector_h1_h10_flow_reports/
          retention-days: 30
