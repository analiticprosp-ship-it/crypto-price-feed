name: BTCI independent episode sensitivity v8.14
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/btci_episode_replay_v814.py'
      - '.github/workflows/btci-episode-replay-v814.yml'
permissions:
  contents: read
jobs:
  episode-sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Reconstruct nine first-regime opportunities and strictly separated ANFCI warning events
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python research/btci_episode_replay_v814.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btci-v814-episode-lockout-audit
          path: btci_v814_reports/
          retention-days: 30
