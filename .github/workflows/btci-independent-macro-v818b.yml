name: BTCI independent real yields dollar curve long history v8.18b
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/btci_independent_macro_confluence_v818b.py'
      - '.github/workflows/btci-independent-macro-v818b.yml'
permissions:
  contents: read
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Verify authentic FRED Sunday asof macro and run preregistered BTC direction and drawdown study
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python research/btci_independent_macro_confluence_v818b.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btci-v818b-real-yields-dollar-curve-research
          path: btci_v818b_reports/
          retention-days: 30
