name: Detector Futures Download v4.6
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python research/detector_futures_download_v46.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detector-futures-download-v46-results
          path: detector_futures_download_v46_results/
          retention-days: 30
