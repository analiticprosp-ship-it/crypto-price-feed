name: BTCI historical dollar and curve original vintage pilot v8.18a2
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/btci_early_dollar_curve_pilot_v818a2.py'
      - '.github/workflows/btci-old-dollar-curve-audit-v818a2.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Reconstruct authentic early vintages for discontinued historical USD index and original Treasury rates
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python research/btci_early_dollar_curve_pilot_v818a2.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btci-v818a2-dollar-curve-vintage-source-pilot
          path: btci_v818a2_reports/
          retention-days: 30
