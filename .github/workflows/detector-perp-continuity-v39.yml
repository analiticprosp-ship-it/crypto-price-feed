name: Detector Perp Continuity v3.9
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python research/detector_perp_continuity_v39.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detector-perp-continuity-v39-results
          path: detector_perp_continuity_v39_results/
          retention-days: 30
