name: H1H10 OKX Nine Stream Receipt Gap Offline Guard
on:
  pull_request:
    paths:
      - 'research/detector_okx_3metric_receipt_audit.py'
      - 'research/test_detector_okx_3metric_receipt_audit.py'
      - '.github/workflows/detector-h1h10-receipt-gaps-pr.yml'
permissions:
  contents: read
jobs:
  audit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Run fail-closed original PIT and per-stream receipt audit tests without secrets
        run: python -m unittest -v research.test_detector_okx_3metric_receipt_audit
