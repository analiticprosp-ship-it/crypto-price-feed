name: Detector sweep robustness v6.6
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sweep-robustness:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependency
        run: python -m pip install boto3
      - name: Run 100-control-draw robustness replay
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python research/detector_sweep_robustness_v66.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detector-v66-sweep-robustness
          path: detector_v66_reports/
          retention-days: 30
