name: Detector H1-H10 Fastlane Gatekeeper
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/detector-h1h10-fastlane.yml'
      - 'research/detector_h1h10_fastlane.py'
      - 'research/test_detector_h1h10_fastlane.py'
      - 'research/detector_h1h10_join_readiness.py'
      - 'research/test_detector_h1h10_join_readiness.py'
      - 'research/detector_h1h10_verified_source_inventory.py'
      - 'research/detector_okx_3metric_receipt_audit.py'
      - 'research/test_detector_okx_3metric_receipt_audit.py'
      - 'research/detector_h1h10_okx_receipt_join_guard.py'
      - 'research/test_detector_h1h10_okx_receipt_join_guard.py'
      - 'research/detector_h1h10_okx_pilot_expiry_audit.py'
      - 'research/test_detector_h1h10_okx_pilot_expiry_audit.py'
  workflow_dispatch:
  schedule:
    - cron: '45 6 * * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: detector-h1h10-fastlane-readiness
  cancel-in-progress: false
jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal storage client before tests that import it
        run: python -m pip install 'boto3>=1.35,<2'
      - name: Offline anti-lookahead, frozen SHA and no trading authority tests
        run: python -m unittest -v research.test_detector_h1h10_fastlane research.test_detector_h1h10_join_readiness research.test_detector_h1h10_verified_source_inventory research.test_detector_okx_3metric_receipt_audit research.test_detector_h1h10_okx_receipt_join_guard research.test_detector_h1h10_okx_pilot_expiry_audit
      - name: Build independent SHA and clock-aware 7-day OI plus 3-day flow inventory
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python -m research.detector_h1h10_verified_source_inventory
      - name: Audit actual OKX first-receipts and R2-linked price OI flow with strict PIT limits
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python -m research.detector_okx_3metric_receipt_audit
      - name: Verify latest OKX nine raw receipts and archive candidate-only same-venue diagnostics
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python -m research.detector_h1h10_okx_receipt_join_guard
      - name: Independently verify two 48h pilot expiry configs and live GitHub workflow disabled state
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python -m research.detector_h1h10_okx_pilot_expiry_audit
      - name: Compute research stage gates from SHA-pinned primary evidence
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python -m research.detector_h1h10_fastlane
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detector-h1h10-fastlane-readiness
          path: |
            detector_h1h10_fastlane/status.json
            detector_h1h10_fastlane/okx_three_metric_receipt_audit.json
            detector_h1h10_fastlane/okx_receipt_candidate.json
            detector_h1h10_fastlane/okx_pilot_expiry.json
            detector_h1h10_evidence_inventory/inventory.json
            detector_h1h10_evidence_inventory/inventory.csv
          retention-days: 30
          if-no-files-found: warn
