name: Detector H1-H10 Price OI Null Baseline Falsification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/detector-h1h10-price-oi-null-controls.yml'
      - 'research/detector_tardis_price_oi_null_controls.py'
      - 'research/test_detector_tardis_price_oi_null_controls.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install R2 SDK
        run: python -m pip install 'boto3>=1.35,<2'
      - name: Verify training-only base-rate, 50pct Brier and immutable model replay
        run: python -m unittest -v research.test_detector_tardis_price_oi_null_controls
      - name: Independently replay pinned prior report and evaluate two simple controls
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python -m research.detector_tardis_price_oi_null_controls
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detector-h1h10-null-baselines
          path: detector_price_oi_falsification_controls/report.json
          if-no-files-found: warn
          retention-days: 30
