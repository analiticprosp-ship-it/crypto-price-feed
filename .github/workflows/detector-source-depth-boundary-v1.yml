name: Detector H1-H10 Free Source Depth Boundary v1
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/detector-source-depth-boundary-v1.yml'
      - 'research/detector_source_depth_boundary_v1.py'
      - 'research/test_detector_source_depth_boundary_v1.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: detector-h1h10-source-depth-boundary
  cancel-in-progress: false
jobs:
  boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate fail-closed source depth controls
        run: python -m unittest -v research.test_detector_source_depth_boundary_v1
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Probe public source archive boundaries and verify private R2 evidence
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python -m research.detector_source_depth_boundary_v1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detector-source-depth-boundary-v1
          path: detector_source_depth_boundary_v1/report.json
          retention-days: 30
