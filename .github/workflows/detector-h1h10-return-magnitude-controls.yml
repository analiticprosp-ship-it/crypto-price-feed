name: Detector H1-H10 Future Return Magnitude Null Controls
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/detector-h1h10-return-magnitude-controls.yml'
      - 'research/detector_tardis_oi_abs_return_magnitude.py'
      - 'research/test_detector_tardis_oi_abs_return_magnitude.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exploratory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Offline absolute-return regression and holdout safeguards
        run: python -m unittest -v research.test_detector_tardis_oi_abs_return_magnitude
      - name: Read pinned receipt-asof data and calculate fixed 15m and 60m magnitude controls
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python -m research.detector_tardis_oi_abs_return_magnitude
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detector-h1h10-exploratory-magnitude-controls
          path: detector_tardis_oi_abs_return/report.json
          if-no-files-found: warn
          retention-days: 30
