name: Detector complete 2020-2026 historical cycle v7.5
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/detector_full_cycle_v75.py'
      - '.github/workflows/detector-full-cycle-v75.yml'
permissions:
  contents: read
concurrency:
  group: detector-research-v75-cycle
  cancel-in-progress: false
jobs:
  annual-history:
    strategy:
      fail-fast: false
      matrix:
        year: [2020, 2021, 2022, 2023, 2024, 2025, 2026]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install R2 client
        run: python -m pip install 'boto3>=1.35,<2'
      - name: Replay all BTC and ETH full months in historical UTC year
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python research/detector_full_cycle_v75.py --year ${{ matrix.year }}
      - name: Year research audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detector-v75-year-${{ matrix.year }}
          path: detector_v75_reports/
          retention-days: 30
  full-cycle-comparison:
    needs: annual-history
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install R2 client
        run: python -m pip install 'boto3>=1.35,<2'
      - name: Reconcile all 162 months and compare archived 42 prior
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python research/detector_full_cycle_v75.py --combine
      - name: Upload combined historical report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detector-v75-full-cycle-comparison
          path: detector_v75_reports/
          retention-days: 30
