name: Detector Tardis Catalog Discovery v2.4.1
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python research/detector_tardis_catalog_v241.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detector-tardis-catalog-v241-results
          path: detector_tardis_catalog_v241_results/
          retention-days: 30
