name: BTCI MVRV backfilled historical crash correlation v8.18d
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/btci_mvrv_retrospective_v818d.py'
      - '.github/workflows/btci-mvrv-retrospective-v818d.yml'
permissions:
  contents: read
jobs:
  retrospective:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Test backfilled non-PIT MVRV BTC overheat against frozen BTC 684 Sunday crash outcomes research only
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python research/btci_mvrv_retrospective_v818d.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btci-v818d-mvrv-backfilled-not-pit-study
          path: btci_v818d_reports/
          retention-days: 30
