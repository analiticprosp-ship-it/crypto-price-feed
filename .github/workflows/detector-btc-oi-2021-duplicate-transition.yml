name: Detector H1-H10 BTC OI 2021 Duplicate Transition
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/detector-btc-oi-2021-duplicate-transition.yml'
      - 'research/detector_btc_oi_2021_transition_v1.py'
      - 'research/test_detector_btc_oi_2021_transition_v1.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test strict month-bracket and partial-data guards
        run: python -m unittest -v research.test_detector_btc_oi_2021_transition_v1
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Measure primary Binance OI exact 2021 timestamp duplicate transition
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python -m research.detector_btc_oi_2021_transition_v1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detector-btc-oi-2021-duplicate-transition
          path: detector_btc_oi_2021_transition/report.json
          retention-days: 30
