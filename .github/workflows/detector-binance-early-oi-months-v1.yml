name: Detector H1-H10 Binance Complete Early OI Months
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/detector-binance-early-oi-months-v1.yml'
      - 'research/detector_binance_oi_early_month_calendars_v1.py'
      - 'research/test_detector_binance_oi_early_month_calendars_v1.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  month-calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check full-month and original-duplicate evidence guards
        run: python -m unittest -v research.test_detector_binance_oi_early_month_calendars_v1
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Byte-audit every Binance OI day and save original provenance
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python -m research.detector_binance_oi_early_month_calendars_v1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detector-binance-early-oi-complete-months-v1
          path: detector_binance_early_oi_month_calendars/report.json
          retention-days: 30
