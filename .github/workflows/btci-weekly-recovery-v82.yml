name: BTCI historic weekly recovery audit v8.2
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/btci_weekly_recovery_v82.py'
      - '.github/workflows/btci-weekly-recovery-v82.yml'
permissions:
  contents: read
concurrency:
  group: btci-research-v82-weekly-recovery
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Check historical BTC weekly trends and major-alt breadth at frozen recovery dates
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python research/btci_weekly_recovery_v82.py
      - name: Upload audit copy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btci-v82-weekly-recovery-study
          path: btci_v82_reports/
          retention-days: 30
