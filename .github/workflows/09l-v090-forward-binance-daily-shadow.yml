name: "09L daily Binance public source archive & frozen price-only holdout (SHADOW)"
on:
  push:
    branches: [main]
    paths: [.github/workflows/09l-v090-forward-binance-daily-shadow.yml]
  schedule:
    - cron: "11 11 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: 09l-binance-usdm-daily-price-only-research
  cancel-in-progress: false
jobs:
  closed-day-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: "Checkout research ONLY; main only schedules"
        uses: actions/checkout@v4
        with:
          ref: research/09l-v089-historical-robustness-20261027
          persist-credentials: false
      - name: "Pre-declared date-selection and fixed-rule parser integrity check"
        run: |
          test -s research/09l/v0.8.9-2026-10-27/PREREG_FORWARD_DAILY_FROM_OCT27_LOCKED.md
          python -m py_compile research/09l/v0.8.9-2026-10-27/binance_daily_aggtrade_price_probe.py research/09l/v0.8.9-2026-10-27/binance_forward_daily_report.py research/09l/v0.8.9-2026-10-27/binance_daily_r2_archive.py
          python research/09l/v0.8.9-2026-10-27/binance_daily_aggtrade_price_probe.py --selftest
      - name: "Collect only fully closed UTC days Oct27 onward, retry last seven dates"
        run: python -u research/09l/v0.8.9-2026-10-27/binance_daily_aggtrade_price_probe.py --recent
      - name: "Rebuild ex-ante-date nontrading report, count all missing closed UTC days"
        run: python -u research/09l/v0.8.9-2026-10-27/binance_forward_daily_report.py
      - name: "Archive only verified derived daily data into EXISTING private R2 and check SHA256 readback"
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          python -m pip install --quiet boto3
          python -u research/09l/v0.8.9-2026-10-27/binance_daily_r2_archive.py --all-available
      - name: "Retain only derived research receipt and forward-ledger files"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 09l-forward-calendar-binance-price-only-qa
          path: |
            research/09l/v0.8.9-2026-10-27/derived/daily_binance/**/*.json
            research/09l/v0.8.9-2026-10-27/derived/forward_ledgers/*.json
            research/09l/v0.8.9-2026-10-27/derived/r2/*.json
          retention-days: 30
          if-no-files-found: warn
      - name: "Writeback STRICT 09L derived JSON on isolated research ref only"
        if: success()
        shell: bash
        env:
          GITHUB_PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "research/09l-v089-historical-robustness-20261027"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/09l/v0.8.9-2026-10-27/derived
          if git diff --cached --quiet; then exit 0; fi
          if git diff --cached --name-only | grep -Ev '^research/09l/v0.8.9-2026-10-27/derived/.+\.json$'; then echo "FORBIDDEN_WRITE_PATH" >&2;exit 1;fi
          git commit -m "research(09L): append price-only forward daily source verification and true missing-day audit"
          git pull --rebase origin research/09l-v089-historical-robustness-20261027
          AUTH="$(printf 'x-access-token:%s' "$GITHUB_PUSH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${AUTH}" push origin HEAD:research/09l-v089-historical-robustness-20261027
