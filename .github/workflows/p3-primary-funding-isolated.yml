name: P3 isolated historical funding archives
on:
  push:
    branches: [research/p3-infra-crises-20261101]
    paths:
      - research/p3-infra-crises-20261101/collect_primary_funding.py
      - .github/workflows/p3-primary-funding-isolated.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: p3-primary-funding-isolated
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == 'refs/heads/research/p3-infra-crises-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Collect checksummed public historical funding archives
        run: python -u research/p3-infra-crises-20261101/collect_primary_funding.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p3-primary-funding-evidence
          path: research/p3-infra-crises-20261101/funding_runs
          retention-days: 30
      - name: Persist only isolated P3 funding research data
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/research/p3-infra-crises-20261101'
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/p3-infra-crises-20261101/funding_runs
          if git diff --cached --quiet; then exit 0; fi
          test "$(git diff --cached --name-only | grep -Ev '^research/p3-infra-crises-20261101/funding_runs/.+\.json$' | wc -l)" -eq 0
          git commit -m 'research(P3): archive historical funding with publisher checksums'
          git pull --rebase origin research/p3-infra-crises-20261101
          git push origin HEAD:research/p3-infra-crises-20261101
