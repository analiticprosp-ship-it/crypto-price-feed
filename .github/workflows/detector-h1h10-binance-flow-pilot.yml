name: H1H10 Binance Bounded Spot Perp Flow Archive Pilot
on:
  push:
    branches: [main]
    paths:
      - 'research/detector_h1h10_binance_flow_archive_pilot.py'
      - 'research/test_detector_h1h10_binance_flow_archive_pilot.py'
      - '.github/workflows/detector-h1h10-binance-flow-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: h1h10-binance-bounded-flow-pilot
  cancel-in-progress: false
jobs:
  bounded-source-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Verify publication-clock, publisher checksum, spot micros and limits offline
        run: python -m unittest -v research.test_detector_h1h10_binance_flow_archive_pilot
      - name: Run 84 capped HEAD checks and six official checksum+CSV verified 5m price samples, existing R2 only
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python -m research.detector_h1h10_binance_flow_archive_pilot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h1h10-binance-bounded-flow-source-provenance
          path: detector_h1h10_binance_source_pilot/pilot.json
          retention-days: 30
          if-no-files-found: warn
