name: Detector Tardis Collector Latency v3.0
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  latency:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python research/detector_tardis_latency_v30.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detector-tardis-latency-v30-results
          path: detector_tardis_latency_v30_results/
          retention-days: 30
