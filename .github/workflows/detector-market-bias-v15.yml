name: Detector SHADOW Market Bias and Adaptive LONG v1.5
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python research/detector_market_bias_v15.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detector-market-bias-v15-results
          path: |
            detector_market_bias_v15_results/
            detector_post_stop_v14_results/manifest.json
          retention-days: 30
