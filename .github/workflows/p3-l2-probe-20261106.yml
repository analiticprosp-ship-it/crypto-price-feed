name: P3 L2 sample probe (research only)
on:
  push:
    branches: [research/p3-infra-crises-20261101]
    paths: [.github/workflows/p3-l2-probe-20261106.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  l2-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CRYPTOHFTDATA_API_KEY: ${{ secrets.CRYPTOHFTDATA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Check key presence (no value disclosure)
        shell: bash
        run: |
          if [ -z "$CRYPTOHFTDATA_API_KEY" ]; then
            echo "::error::CRYPTOHFTDATA_API_KEY missing from Actions secrets"
            exit 1
          fi
          echo "Secret configured (value not printed)"
      - name: Download small sample, fail-closed
        shell: bash
        run: |
          python research/p3-infra-crises-20261101/continuation_20261106/probe_l2_samples.py --out /tmp/p3-l2-probe --hour 12
      - name: Upload receipts only (not raw market data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3-l2-probe-receipts
          path: /tmp/p3-l2-probe/probe_manifest.json
          if-no-files-found: warn
          retention-days: 30
