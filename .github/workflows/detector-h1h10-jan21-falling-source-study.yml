name: H1H10 January21 Prior BTC Falling Flow Study
on:
  push:
    branches: [main]
    paths:
      - 'research/detector_h1h10_selected_falling_jan21_flow.py'
      - 'research/test_detector_h1h10_selected_falling_jan21_flow.py'
      - '.github/workflows/detector-h1h10-jan21-falling-source-study.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: h1h10-preselected-falling-jan21-source
  cancel-in-progress: false
jobs:
  event-only-negative-regime:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Validate exact pinned prior BTC falling selection and no flow informed date selection
        run: python -m unittest -v research.test_detector_h1h10_selected_falling_jan21_flow
      - name: Verify 4 original Jan21 Spot USD-M flow price pairs with SHA and event-only correlations
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python -m research.detector_h1h10_selected_falling_jan21_flow
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h1h10-jan21-selected-bear-event-only-evidence
          path: detector_h1h10_falling_jan21_evidence/report.json
          retention-days: 30
          if-no-files-found: warn
