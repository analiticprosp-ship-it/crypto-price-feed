name: BTCI UST PIT04 official archives research only
on:
  push:
    branches:
      - research/btci-ust-pit04-20261022
permissions:
  contents: read
  actions: read
jobs:
  official-macro-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe official Treasury and Fed archives without portfolio operations
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m pip install "requests>=2.31,<3" "beautifulsoup4>=4.12,<5"
          python -m py_compile research/btci_ust_pit04_official_source_probe_2026-10-22.py
          python research/btci_ust_pit04_official_source_probe_2026-10-22.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btci-ust-pit04-official-candidates-NOT-STRICT-PIT
          path: btci_pit04_output/
          if-no-files-found: warn
          retention-days: 30
