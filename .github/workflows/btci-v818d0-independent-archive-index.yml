name: BTCI v8.18d0 independent public archive timestamps versus file contents
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/btci_v818d0_independent_web_archive_probe.py'
      - '.github/workflows/btci-v818d0-independent-archive-index.yml'
permissions:
  contents: read
jobs:
  independent-source-index-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install readback-verifiable Cloudflare R2 client
        run: python -m pip install 'boto3>=1.35,<2'
      - name: Compile and test frozen independent-source probe
        run: |
          python -m py_compile research/btci_v818d0_independent_web_archive_probe.py
          python research/btci_v818d0_independent_web_archive_probe.py --self-test
      - name: Read public Software Heritage and Wayback index, pin BTCI parents, R2 SHA readback
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python research/btci_v818d0_independent_web_archive_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btci-v818d0-independent-archive-index
          path: btci_v818d0_reports/
          retention-days: 30
