name: BTCI v8.18b1 repair exactly one unresolved dollar vintage
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/btci_v818b1_single_gap_recovery.py'
      - '.github/workflows/btci-v818b1-single-gap-recovery.yml'
permissions:
  contents: read
jobs:
  one-gap-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Compile and run local replay safety tests before any cloud requests
        run: |
          python -m py_compile research/btci_v818b1_single_gap_recovery.py
          python research/btci_v818b1_single_gap_recovery.py --self-test
      - name: Recover only the original missing Sunday and SHA verify R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python research/btci_v818b1_single_gap_recovery.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btci-v818b1-single-gap-source-recovery
          path: btci_v818b1_reports/
          retention-days: 30
