name: Detector H1-H10 Independent R2 Integrity Audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/detector-h1-h10-r2-integrity.yml'
      - 'research/detector_r2_integrity_audit.py'
  workflow_dispatch:
  schedule:
    - cron: '31 6 * * *'
permissions:
  contents: read
concurrency:
  group: detector-h1-h10-r2-integrity
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Independent read-only R2 manifest ZIP and SHA256 audit
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python research/detector_r2_integrity_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detector-h1-h10-r2-integrity-report
          path: detector_h1_h10_r2_integrity/audit.json
          if-no-files-found: warn
          retention-days: 30
