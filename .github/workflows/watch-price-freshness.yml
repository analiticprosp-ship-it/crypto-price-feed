name: Watch critical quote freshness (best effort)
on:
  workflow_dispatch:
  schedule:
    - cron: '2,12,22,32,42,52 * * * *'
permissions:
  contents: read
  actions: write
concurrency:
  group: crypto-core-freshness-watch
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check last published quote and dispatch repair on stale
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json,sys,urllib.request
          from datetime import datetime,timezone
          from pathlib import Path
          repo='${{ github.repository }}'
          url=f'https://raw.githubusercontent.com/{repo}/main/prices.json'
          try:
              with urllib.request.urlopen(url,timeout=12) as res: obj=json.load(res)
              date=datetime.fromisoformat(obj['generatedAt'].replace('Z','+00:00'))
              age=(datetime.now(timezone.utc)-date).total_seconds()
              print('Critical quote age seconds:',round(age,1))
              if age<-60: raise RuntimeError('Gateway timestamp is in the future')
              Path('/tmp/needs_dispatch').write_text('1' if age>600 else '0')
          except Exception as err:
              print('Could not validate quote freshness:',err)
              Path('/tmp/needs_dispatch').write_text('1')
          PY
          if [ "$(cat /tmp/needs_dispatch)" = 1 ]; then
            echo 'Quote age >10 min or unreachable. Requesting independent repair attempt.'
            gh workflow run update-prices.yml --repo "$REPOSITORY" --ref main
          else
            echo 'Critical price snapshot within 10-minute monitoring threshold.'
          fi
