name: Detector Historical Coverage Audit v2.0
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify monthly public spot history availability
        run: python research/detector_historical_coverage_v20.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detector-historical-coverage-v20-results
          path: detector_historical_coverage_v20_results/
          retention-days: 30
