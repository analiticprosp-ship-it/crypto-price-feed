name: Detector H1-H10 Tardis 18 Free Days 5m OI AsOf Audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/detector-tardis-18-oi-asof-v1.yml'
      - 'research/detector_tardis_18_free_oi_asof_v1.py'
      - 'research/test_detector_tardis_18_free_oi_asof_v1.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify lookahead, freshness, missing and SHA fail-closed tests
        run: python -m unittest -v research.test_detector_tardis_18_free_oi_asof_v1
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Audit vendor-receipt asof 5m OI with 18 pinned verified source files
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python -m research.detector_tardis_18_free_oi_asof_v1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detector-tardis-18-free-oi-asof
          path: detector_tardis_18_oi_asof/report.json
          retention-days: 30
