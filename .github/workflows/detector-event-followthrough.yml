name: Detector SHADOW Signal Followthrough
on:
  workflow_dispatch:
    inputs:
      date:
        description: "UTC event date"
        required: true
        default: "2026-10-16"
        type: string
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Evaluate post-detection price movement (SHADOW)
        env:
          DATE: ${{ inputs.date }}
        run: python research/detector_event_followthrough.py --date "$DATE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detector-event-followthrough-results
          path: detector_event_followthrough_results/
          retention-days: 30
