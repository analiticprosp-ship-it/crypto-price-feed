name: BTCI 138 historical NFCI ANFCI asof vintage research v8.13
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/btci_nfci_asof_v813.py'
      - '.github/workflows/btci-nfci-asof-v813.yml'
permissions:
  contents: read
jobs:
  asof-research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Verify 138 Sunday asof historic NFCI ANFCI vintages and audit matched BTC phase outcomes
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python research/btci_nfci_asof_v813.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btci-v813-nfci-anfci-historical-asof
          path: btci_v813_reports/
          retention-days: 30
