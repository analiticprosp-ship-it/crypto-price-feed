name: H1H10 Binance AggTrades First Source Offline Guard
on:
  pull_request:
    paths:
      - 'research/detector_h1h10_binance_aggtrades_first_verified.py'
      - 'research/test_detector_h1h10_binance_aggtrades_first_verified.py'
      - '.github/workflows/detector-h1h10-binance-aggtrades-first.yml'
      - '.github/workflows/detector-h1h10-binance-aggtrades-first-pr.yml'
permissions:
  contents: read
jobs:
  source-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Offline fail-closed raw aggTrades 5m event-time and cap tests
        run: python -m unittest -v research.test_detector_h1h10_binance_aggtrades_first_verified
