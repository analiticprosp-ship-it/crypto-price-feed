name: "09L AUTO v1.1 hourly as-collected spot-perp book sampling (NO TRADING)"
on:
  push:
    branches: [main]
    paths: [.github/workflows/09l-auto-v11-hourly-books.yml]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: 09l-auto-v11-hourly-public-book-sampler
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout isolated research-only code
        uses: actions/checkout@v4
        with:
          ref: research/09l-v089-historical-robustness-20261027
          persist-credentials: false
      - name: Static and behavioral sampler self-test
        run: |
          python -m py_compile research/09l/auto/v1/live_book_sampler.py
          python research/09l/auto/v1/live_book_sampler.py --selftest
      - name: Capture public orderbook REST top-25 at actual time, never backfill
        run: python -u research/09l/auto/v1/live_book_sampler.py
      - name: Publish metadata, never vendor raw streams or keys
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 09l-auto-v11-hourly-public-book-derived
          path: research/09l/auto/v1/derived/live_snapshots/**/*.json
          if-no-files-found: warn
          retention-days: 30
      - name: Append only captured metadata to research branch
        if: success()
        shell: bash
        env:
          GITHUB_PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "research/09l-v089-historical-robustness-20261027"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/09l/auto/v1/derived/live_snapshots
          if git diff --cached --quiet; then exit 0; fi
          test "$(git diff --cached --name-only | grep -Ev '^research/09l/auto/v1/derived/live_snapshots/.+\.json$' | wc -l)" -eq 0
          git commit -m "research(09L AUTO): append one sparse timestamped book sample, including access gaps"
          git pull --rebase origin research/09l-v089-historical-robustness-20261027
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GITHUB_PUSH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${AUTH_HEADER}" push origin HEAD:research/09l-v089-historical-robustness-20261027
