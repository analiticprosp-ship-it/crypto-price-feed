name: BTCI historic cycle episodes and full daily price archive v8.7
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/btci_trend_episodes_archive_v87.py'
      - '.github/workflows/btci-cycles-archive-v87.yml'
permissions:
  contents: read
concurrency:
  group: btci-research-v87-cycle-archive
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Verify all 8 historical daily sources, archive R2 and analyse 2011-26 trend episodes
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python research/btci_trend_episodes_archive_v87.py
      - name: Export audit summary, source manifest and complete transitions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btci-v87-historical-transition-archive
          path: btci_v87_reports/
          retention-days: 30
