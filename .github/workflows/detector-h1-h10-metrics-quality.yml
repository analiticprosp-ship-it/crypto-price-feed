name: Detector H1-H10 Metrics Quality Audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/detector-h1-h10-metrics-quality.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: detector-h1-h10-metrics-history
          run-id: 39034387923
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: detector_h1_h10_metrics_history
      - name: Audit all downloaded 5-minute metrics
        run: python research/detector_h1_h10_metrics_quality.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detector-h1-h10-metrics-quality-report
          path: detector_h1_h10_metrics_quality/
          retention-days: 30
