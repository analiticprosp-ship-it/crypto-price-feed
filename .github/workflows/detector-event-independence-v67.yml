name: Detector event independence v6.7
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  event-independence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install boto3
      - name: Run cluster-aware replay
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python research/detector_event_independence_v67.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detector-v67-event-independence
          path: detector_v67_reports/
          retention-days: 30
