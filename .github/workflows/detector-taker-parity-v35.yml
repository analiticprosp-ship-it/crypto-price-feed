name: Detector Taker Parity v3.5
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python research/detector_taker_parity_v35.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detector-taker-parity-v35-results
          path: detector_taker_parity_v35_results/
          retention-days: 30
