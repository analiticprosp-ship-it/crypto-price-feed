name: Build research Nadaraya Watson
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/build_nadaraya_watson_research.py'
      - 'tests/test_nadaraya_watson_research.py'
      - '.github/workflows/build-nadaraya-watson-research.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/build_nadaraya_watson_research.py'
      - 'tests/test_nadaraya_watson_research.py'
      - '.github/workflows/build-nadaraya-watson-research.yml'
  workflow_run:
    workflows: ["Update market structure"]
    types: [completed]
permissions:
  contents: write
concurrency:
  group: research-nadaraya-watson
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate no lookahead and explicit parity limits
        run: python -m unittest discover -s tests -p 'test_nadaraya_watson_research.py' -v
      - name: Calculate read-only closed-bar N-W research
        run: python scripts/build_nadaraya_watson_research.py
      - name: Publish research artifact only
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nadaraya-watson-research.json
          git diff --cached --quiet && exit 0
          git commit -m 'Update N-W closed-bar research only'
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 3
          done
          exit 1
