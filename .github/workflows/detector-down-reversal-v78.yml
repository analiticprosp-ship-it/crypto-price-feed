name: Detector down-sweep conditional research v7.8
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/detector_down_reversal_v78.py'
      - '.github/workflows/detector-down-reversal-v78.yml'
permissions:
  contents: read
concurrency:
  group: detector-research-v78-down-sweep
  cancel-in-progress: false
jobs:
  conditional-asset:
    strategy:
      fail-fast: false
      matrix:
        asset: [BTC, ETH, SOL, BNB, LINK, XRP, ADA, DOGE]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Verify original historical archives and classify DOWN Sweep features
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python research/detector_down_reversal_v78.py --asset ${{ matrix.asset }}
      - name: Upload isolated research audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detector-v78-down-${{ matrix.asset }}
          path: detector_v78_reports/
          retention-days: 30
  conditional-audit:
    needs: conditional-asset
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'boto3>=1.35,<2' 'numpy>=2,<3'
      - name: Audit down-only signals, epochs and quarter bootstrap over 24 comparisons
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python research/detector_down_reversal_v78.py --combine
      - name: Upload combined findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detector-v78-conditional-research
          path: detector_v78_reports/
          retention-days: 30
