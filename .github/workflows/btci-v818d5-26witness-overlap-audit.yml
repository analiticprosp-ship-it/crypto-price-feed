name: BTCI v8.18d5 26 historical MVRV witnesses and 13 26 52 week spacing
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/btci_v818d5_26week_provenance_and_independence.py'
      - '.github/workflows/btci-v818d5-26witness-overlap-audit.yml'
permissions:
  contents: read
jobs:
  asof-witness-timeline-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Compile and test independent source UTC gates
        run: |
          python -m py_compile research/btci_v818d5_26week_provenance_and_independence.py
          python research/btci_v818d5_26week_provenance_and_independence.py --self-test
      - name: Join provenance and quantify only temporal spacing, SHA-check R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python research/btci_v818d5_26week_provenance_and_independence.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btci-v818d5-26witness-and-overlap-audit
          path: btci_v818d5_reports/
          retention-days: 30
