name: Detector Tardis Sample Discovery v2.4
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python research/detector_tardis_samples_v24.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detector-tardis-samples-v24-results
          path: detector_tardis_samples_v24_results/
          retention-days: 30
