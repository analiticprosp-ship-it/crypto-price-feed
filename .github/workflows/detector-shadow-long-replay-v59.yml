name: Detector shadow LONG replay v5.9
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shadow-long:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'boto3>=1.35,<2'
      - name: Replay historical BTC ETH shadow LONG hypotheses
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python research/detector_shadow_long_replay_v59.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detector-v59-shadow-long-replay
          path: detector_v59_reports/
          retention-days: 30
