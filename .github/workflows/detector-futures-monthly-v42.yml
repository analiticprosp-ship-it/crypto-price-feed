name: Detector Futures Monthly v4.2
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python research/detector_futures_monthly_v42.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detector-futures-monthly-v42-results
          path: detector_futures_monthly_v42_results/
          retention-days: 30
