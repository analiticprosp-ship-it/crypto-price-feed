name: Detector H1-H10 Chronological Price vs OI Exploratory Ablation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/detector-h1h10-price-oi-chrono-ablation.yml'
      - 'research/detector_tardis_price_oi_chrono_ablation.py'
      - 'research/test_detector_tardis_price_oi_chrono_ablation.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exploratory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install R2 SDK
        run: python -m pip install 'boto3>=1.35,<2'
      - name: Offline chronological and anti-lookahead regression suite
        run: python -m unittest -v research.test_detector_tardis_price_oi_chrono_ablation
      - name: Read pinned R2 as-of inputs and test future-only 15m/60m price vs OI
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python -m research.detector_tardis_price_oi_chrono_ablation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detector-h1h10-price-vs-oi-chrono-exploratory
          path: detector_price_oi_chrono_ablation/report.json
          if-no-files-found: warn
          retention-days: 30
