name: Detector post-hoc month-cluster uncertainty v7.1
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/detector_overlap_uncertainty_v71.py'
      - '.github/workflows/detector-overlap-uncertainty-v71.yml'
permissions:
  contents: read
concurrency:
  group: detector-research-v71
  cancel-in-progress: false
jobs:
  month-cluster-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install R2 client
        run: python -m pip install boto3
      - name: Evaluate immutable v6.9 and v7.0 reports with month-cluster resampling
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python research/detector_overlap_uncertainty_v71.py
      - name: Upload research-only audit copy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detector-v71-month-cluster-audit
          path: detector_v71_reports/
          retention-days: 30
