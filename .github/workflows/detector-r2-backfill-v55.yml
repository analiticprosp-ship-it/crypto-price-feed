name: Detector R2 backfill batches 0-10 v5.5
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: detector-r2-ingest-v51
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Inventory and verify stored archive bytes
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python research/detector_r2_audit_v53.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detector-v55-inventory
          path: r2_audit_v53/
          retention-days: 30
  backfill:
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Backfill only missing objects in batches 0-10
        shell: bash
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -uo pipefail
          mkdir -p v55_reports
          failed=0
          for batch in {0..10}; do
            echo "::group::Batch ${batch}"
            rm -rf r2_ingest_report
            if python research/detector_r2_ingest_v51.py --batch "${batch}" --batch-size 36 --workers 6; then
              echo "Batch ${batch}: complete"
            else
              echo "Batch ${batch}: errors recorded"
              failed=1
            fi
            mkdir -p "v55_reports/batch_${batch}"
            if [ -f r2_ingest_report/batch.json ]; then
              cp r2_ingest_report/batch.json "v55_reports/batch_${batch}/batch.json"
            else
              echo '{"status":"MISSING_REPORT"}' > "v55_reports/batch_${batch}/batch.json"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "${failed}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detector-v55-backfill-reports
          path: v55_reports/
          retention-days: 30
