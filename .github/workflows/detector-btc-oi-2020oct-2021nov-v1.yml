name: Detector H1-H10 BTC OI 2020 Oct To 2021 Nov Daily Calendar
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/detector-btc-oi-2020oct-2021nov-v1.yml'
      - 'research/detector_btc_oi_2020oct_2021nov_v1.py'
      - 'research/test_detector_btc_oi_2020oct_2021nov_v1.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  btc-source-window:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        window: [2020Q4, 2021Q1, 2021Q2, 2021Q3, 2021OCTNOV]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Enforce source calendar and no-duplicate-scope tests
        run: python -m unittest -v research.test_detector_btc_oi_2020oct_2021nov_v1
      - name: Install R2 client
        run: python -m pip install 'boto3>=1.35,<2'
      - name: Byte-verify every original BTC OI day and read back report SHA256
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python -m research.detector_btc_oi_2020oct_2021nov_v1 --window ${{ matrix.window }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detector-btc-oi-source-${{ matrix.window }}
          path: detector_btc_2020oct_2021nov/${{ matrix.window }}.json
          retention-days: 30
