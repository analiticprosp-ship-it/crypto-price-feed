name: "09L v089 CoinGlass Model2 entitlement presence preflight (NO API OR PAYMENT)"
on:
  push:
    branches: [research/09l-v089-historical-robustness-20261027]
    paths: [.github/workflows/09l-v089-coinglass-secret-preflight.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  presence-only:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CG_API_KEY: ${{ secrets.CG_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: "Check actual Model2 private-R2 collection module without calling provider"
        run: |
          python -m py_compile research/09l/auto/v1/coinglass_existing_r2_pit.py
          python research/09l/auto/v1/coinglass_existing_r2_pit.py --selftest
      - name: "SAFE: check existence of configured secret; do not show value or query endpoint"
        shell: bash
        run: |
          if test -z "${CG_API_KEY}"; then
            echo "COINGLASS_MODEL2_API_KEY_MISSING (zero API calls)" >> "$GITHUB_STEP_SUMMARY"
            echo "COINGLASS_MODEL2_KEY_NOT_CONFIGURED"
          else
            echo "COINGLASS_MODEL2_API_KEY_PRESENT_BUT_ENTITLEMENT_UNVERIFIED (zero API calls)" >> "$GITHUB_STEP_SUMMARY"
            echo "COINGLASS_MODEL2_KEY_PRESENT_NO_API_USED"
          fi
