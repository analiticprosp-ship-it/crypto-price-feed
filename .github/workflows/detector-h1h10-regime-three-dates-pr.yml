name: H1H10 Three Preholdout Regime Offline Guard
on:
  pull_request:
    paths:
      - 'research/detector_h1h10_regime_prewindow_three_dates.py'
      - 'research/test_detector_h1h10_regime_prewindow_three_dates.py'
      - 'research/detector_h1h10_binance_flow_archive_pilot.py'
      - 'research/detector_h1h10_binance_aggtrades_first_verified.py'
      - 'research/detector_h1h10_binance_one_day_event_diagnostics.py'
      - '.github/workflows/detector-h1h10-regime-three-dates.yml'
      - '.github/workflows/detector-h1h10-regime-three-dates-pr.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Three fixed dates plus May original no-PIT regression suite
        run: python -m unittest -v research.test_detector_h1h10_regime_prewindow_three_dates research.test_detector_h1h10_binance_week_event_expansion research.test_detector_h1h10_binance_aggtrades_first_verified research.test_detector_h1h10_binance_one_day_event_diagnostics
