name: BTCI BTC true peak to trough stress after rally v8.18d2
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/btci_mvrv_after_rally_drawdown_v818d2.py'
      - '.github/workflows/btci-btc-path-risk-after-rally-v818d2.yml'
permissions:
  contents: read
jobs:
  path-risk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Compare original price drawdown after intermediate BTC rally to original signal-date losses in MVRV cohort
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python research/btci_mvrv_after_rally_drawdown_v818d2.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btci-v818d2-after-rally-btc-max-drawdown
          path: btci_v818d2_reports/
          retention-days: 30
