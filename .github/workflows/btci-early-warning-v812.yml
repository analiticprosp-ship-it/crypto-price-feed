name: BTCI early warning gate ablation v8.12
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/btci_early_warning_v812.py'
      - '.github/workflows/btci-early-warning-v812.yml'
permissions:
  contents: read
jobs:
  early-warning:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Reproduce fixed sample and research-only independent macro and alt warnings
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python research/btci_early_warning_v812.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btci-v812-early-warning-comparison
          path: btci_v812_reports/
          retention-days: 30
