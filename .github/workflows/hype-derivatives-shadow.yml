name: HYPE derivatives shadow (manual only)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hype-derivatives-shadow
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Collect independent HYPE derivatives observations
        run: python scripts/update_hype_derivatives_shadow.py
      - name: Show snapshot (no writeback to main)
        run: cat research/hype-derivatives/latest.json
