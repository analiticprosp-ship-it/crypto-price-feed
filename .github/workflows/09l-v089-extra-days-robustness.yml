name: "09L v0.8.9 earlier-regime liquidations, fixed-sign robustness, private R2 (SHADOW)"
on:
  push:
    branches: [research/09l-v089-historical-robustness-20261027]
    paths: [.github/workflows/09l-v089-extra-days-robustness.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: 09l-v089-preregistered-2025-regime-expansion
  cancel-in-progress: false
jobs:
  source-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Freeze and verify prerequisites
        run: |
          test -s research/09l/v0.8.9-2026-10-27/PREREG_2025_QTR_2026_JAN_LOCKED.md
          python -m py_compile research/09l/auto/v1/no_lookahead_v087.py research/09l/v0.8.8-2026-10-23/first_liquidation_event_behaviour.py research/09l/v0.8.9-2026-10-27/prior_sign_probe_v089.py research/09l/v0.8.9-2026-10-27/r2_archive_v089.py
          python research/09l/auto/v1/no_lookahead_v087.py --selftest
          python research/09l/v0.8.8-2026-10-23/first_liquidation_event_behaviour.py --selftest
      - name: "Collect exactly 10 frozen quarterly sources for price-only labels"
        run: |
          python -u - <<'PY'
          import concurrent.futures,subprocess
          script='research/09l/auto/v1/no_lookahead_v087.py'
          studies=[f'{v}_{m}' for v in ('bybit','okx') for m in ('2025jan','2025apr','2025jul','2025oct','2026jan')]
          def run(s):
            x=subprocess.run(['python','-u',script,'--study',s],capture_output=True,text=True,timeout=390)
            return s,x.returncode,x.stdout.strip(),x.stderr[-300:]
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
            res=list(pool.map(run,studies))
          for a in res: print('FIXED_PRICE_STUDY',*a,flush=True)
          assert all(a[1]==0 for a in res),'STOP_MISSING_SOURCE_PRICE_AUDIT'
          PY
      - name: "Observe first liquidations in three frozen day sessions, never choose events from returns"
        run: |
          python -u - <<'PY'
          import concurrent.futures,subprocess
          script='research/09l/v0.8.8-2026-10-23/first_liquidation_event_behaviour.py'
          studies=[f'{v}_{m}' for v in ('bybit','okx') for m in ('2025jan','2025apr','2025jul','2025oct','2026jan')]
          def run(s):
            x=subprocess.run(['python','-u',script,'--study',s],capture_output=True,text=True,timeout=390)
            return s,x.returncode,x.stdout.strip(),x.stderr[-300:]
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
            res=list(pool.map(run,studies))
          for a in res:print('FIXED_FIRST_LIQ_STUDY',*a,flush=True)
          assert all(a[1]==0 for a in res),'STOP_MISSING_SOURCE_LIQ_AUDIT'
          PY
      - name: "Strictly verify source SHA matches and no prospective/OOS inference"
        run: |
          python -u - <<'PY'
          import pathlib,json,collections
          root=pathlib.Path('research/09l');n=0;complete=0;event_n=0;proxies=collections.Counter();missing=[]
          for v in ('bybit','okex-swap'):
            for day in ('2025-01-01','2025-04-01','2025-07-01','2025-10-01','2026-01-01'):
              a=json.loads((root/'auto/v1/derived/v087_labels'/v/f'{day}_no_lookahead_trade_labels.json').read_text())
              b=json.loads((root/'v0.8.8-2026-10-23/derived/liquidation_event_proxies'/v/f'{day}_first_message_behaviour.json').read_text())
              assert a['source_date_utc']==b['source_day_utc']==day
              assert a['venue']==b['venue']==v
              assert a['trading_canon_unchanged'] and b['trading_canon_unchanged']
              assert len(a['eight_clock_fixed_cases'])==8 and len(b['selected_session_events'])==3
              if a['source']['status']=='OK' and b['liquidation_source']['status']=='OK' and b['trade_sources']['status']=='OK':
                assert a['source']['compressed_sha256']==b['trade_sources']['gzip_sha256'],(v,day)
                n+=1
              else:missing.append([v,day,a['source']['status'],b['trade_sources']['status'],b['liquidation_source']['status']])
              complete+=sum(e['status']=='LABEL_READY' for e in a['eight_clock_fixed_cases'])
              event_n+=b['valid_behaviour_labels']
              for e in b['selected_session_events']:
                proxies[e.get('price_behaviour_label',e['status'])]+=1
          print(json.dumps({'source_cohorts_sha_ok':n,'expected_cohorts':10,'clock_complete':complete,
           'clock_eligible_total':80,'first_liq_events_labeled':event_n,'first_liq_opportunities':30,
           'proxy_labels':dict(proxies),'incomplete_sources':missing,
           'not_cluster_first_hit':True,'not_prospective_OOS':True},sort_keys=True))
          assert n==10,'SOURCE_OR_CAPTURE_QA_MISSING; STOP'
          PY
      - name: "Run original unchanged signed preevent-flow and momentum rule across additional older dates"
        run: python -u research/09l/v0.8.9-2026-10-27/prior_sign_probe_v089.py
      - name: "Commit only complete derivations into existing private R2 and SHA256 readback"
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          python -m pip install --quiet boto3
          python -u research/09l/v0.8.9-2026-10-27/r2_archive_v089.py
      - name: "Upload compact derived research-only provenance"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 09l-v089-preregistered-2025-cross-regime
          path: |
            research/09l/v0.8.8-2026-10-23/derived/liquidation_event_proxies/**/*.json
            research/09l/auto/v1/derived/v087_labels/**/*.json
            research/09l/v0.8.9-2026-10-27/derived/**/*.json
          retention-days: 45
          if-no-files-found: warn
      - name: "Append only 09L research JSON in research branch; canonical no write"
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/09l/auto/v1/derived/v087_labels research/09l/v0.8.8-2026-10-23/derived/liquidation_event_proxies research/09l/v0.8.9-2026-10-27/derived
          if git diff --cached --quiet; then exit 0; fi
          if git diff --cached --name-only | grep -Ev '^research/09l/(auto/v1/derived/v087_labels/|v0.8.8-2026-10-23/derived/liquidation_event_proxies/|v0.8.9-2026-10-27/derived/)'; then
            echo "UNAUTHORIZED_SCOPE" >&2; exit 1
          fi
          git commit -m "research(09L v089): freeze historical source QA, unchanged predictor signs and private R2 readbacks"
          git pull --rebase origin research/09l-v089-historical-robustness-20261027
          git push origin HEAD:research/09l-v089-historical-robustness-20261027
