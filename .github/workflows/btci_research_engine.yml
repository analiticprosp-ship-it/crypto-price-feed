name: BTCI RESEARCH ENGINE v0.1 — isolated RESEARCH ONLY
on:
  schedule:
    - cron: '23 7 * * 1,4'
  workflow_dispatch:
    inputs:
      mode:
        description: 'offline, smoke or daily (no trading)'
        required: false
        default: 'daily'
        type: choice
        options: [offline, smoke, daily]
  push:
    branches:
      - research/btci-research-engine-v0-1-20261020
    paths:
      - 'research_engine/**'
      - '.github/workflows/btci_research_engine.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: btci-research-engine-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-tracks:
    name: BTCI ${{ matrix.track }} primary source audit
    runs-on: ubuntu-latest
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        track: [audit, h41, treasury, mvrv]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install read-only parsing dependencies
        run: python -m pip install "requests>=2.31,<3" "beautifulsoup4>=4.12,<5"
      - name: Frozen baseline, provenance and candidate acquisition
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m py_compile research_engine/btci_engine.py
          if [ "${{ github.event_name }}" = "push" ]; then
            MODE="smoke"
          else
            MODE="${{ inputs.mode || 'daily' }}"
          fi
          python research_engine/btci_engine.py --track ${{ matrix.track }} --mode "$MODE" --out research_engine_out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btci-engine-${{ matrix.track }}-${{ github.run_id }}-research-only
          path: research_engine_out/${{ matrix.track }}/
          if-no-files-found: warn
          retention-days: 45
  research-report:
    name: BTCI all tracks audit summary
    needs: [source-tracks]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: btci-engine-*-${{ github.run_id }}-research-only
          path: downloaded
      - name: Emit immutable, non-trading research summary
        run: |
          python research_engine/aggregate.py downloaded research_engine_report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btci-engine-portable-sources-${{ github.run_id }}-research-only
          path: |
            research_engine/
            .github/workflows/btci_research_engine.yml
          retention-days: 45
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btci-engine-summary-${{ github.run_id }}-research-only
          path: research_engine_report/
          if-no-files-found: warn
          retention-days: 45
