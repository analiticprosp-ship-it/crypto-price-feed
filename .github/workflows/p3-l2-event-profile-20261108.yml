name: P3 L2 event profile (research only)
on:
  push:
    branches: [research/p3-infra-crises-20261101]
    paths:
      - .github/workflows/p3-l2-event-profile-20261108.yml
      - research/p3-infra-crises-20261101/continuation_20261108/profile_l2_events.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  event-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pyarrow==21.0.0'
      - uses: actions/download-artifact@v4
        with:
          name: p3-l2-probe-raw
          run-id: 42455425848
          github-token: ${{ github.token }}
          path: /tmp/p3-l2-raw
      - uses: actions/download-artifact@v4
        with:
          name: p3-l2-probe-verified-receipts
          run-id: 42455425848
          github-token: ${{ github.token }}
          path: /tmp/p3-l2-receipts
      - name: Profile actual event fields and timestamps
        run: |
          python research/p3-infra-crises-20261101/continuation_20261108/profile_l2_events.py --raw-dir /tmp/p3-l2-raw --receipts-dir /tmp/p3-l2-receipts --out /tmp/p3-l2-event-profile.json
      - name: Save profile receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3-l2-event-profile
          path: /tmp/p3-l2-event-profile.json
          if-no-files-found: warn
          retention-days: 60
