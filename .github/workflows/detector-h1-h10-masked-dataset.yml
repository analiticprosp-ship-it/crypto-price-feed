name: Detector H1-H10 Quality Masked Dataset
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/detector-h1-h10-masked-dataset.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Validate R2 source resolution and ZIP safety
        run: python -m unittest -v research.test_detector_h1_h10_r2_source
      - name: Fetch verified R2 input (detector-h1-h10-metrics-history)
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python research/detector_h1_h10_r2_source.py --workflow 'Detector H1-H10 Metrics History Expansion' --artifact 'detector-h1-h10-metrics-history' --dest 'detector_h1_h10_metrics_history'
      - name: Fetch verified R2 input (detector-h1-h10-monthly-history-2024-2026)
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python research/detector_h1_h10_r2_source.py --workflow 'Detector H1-H10 Monthly History 2024-2026' --artifact 'detector-h1-h10-monthly-history-2024-2026' --dest 'detector_h1_h10_monthly'
      - name: Build feature-level masks and no-lookahead as-of price joins
        run: python research/detector_h1_h10_masked_dataset.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detector-h1-h10-masked-dataset
          path: detector_h1_h10_masked_dataset/
          retention-days: 30
