name: Detector H1-H10 AsOf Timing Audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/detector-h1-h10-asof-timing-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: 39101980016
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: detector-h1-h10-flow-oi-asof-join
          path: joined
      - run: python research/detector_h1_h10_asof_timing_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detector-h1-h10-asof-timing-audit
          path: detector_h1_h10_asof_audit/
          retention-days: 30
