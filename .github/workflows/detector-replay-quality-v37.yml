name: Detector Replay Quality v3.7
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python research/detector_replay_quality_v37.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detector-replay-quality-v37-results
          path: detector_replay_quality_v37_results/
          retention-days: 30
