name: Detector Tardis Taker Tape v3.3
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python research/detector_tardis_taker_v33.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detector-tardis-taker-v33-results
          path: detector_tardis_taker_v33_results/
          retention-days: 30
