name: P1 v8.16 immutable prospective research
on:
  push:
    branches: ['research/p1-readiness-20261027']
    paths:
      - 'research/p1_20261027/runner.py'
      - 'research/p1_20261027/registration.json'
      - 'research/p1_20261027/tick.json'
      - '.github/workflows/p1-forward-20261027.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p1-prospective-v1
  cancel-in-progress: false
jobs:
  forward-research:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'boto3>=1.35,<2' 'beautifulsoup4>=4.12,<5'
      - name: Test time gates and research isolation
        run: python research/p1_20261027/test_runner.py
      - name: Original model parity, official source checks and immutable research writeback
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python research/p1_20261027/runner.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-v816-forward-research
          path: p1_forward_artifact/
          retention-days: 90
