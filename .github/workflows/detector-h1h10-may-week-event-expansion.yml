name: H1H10 May05-10 Event Only Historical Expansion
on:
  push:
    branches: [main]
    paths:
      - 'research/detector_h1h10_binance_week_event_expansion.py'
      - 'research/test_detector_h1h10_binance_week_event_expansion.py'
      - '.github/workflows/detector-h1h10-may-week-event-expansion.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: h1h10-may05-10-bounded-oneoff
  cancel-in-progress: false
jobs:
  preholdout-day:
    name: Research event-only ${{ matrix.day }}
    runs-on: ubuntu-latest
    timeout-minutes: 19
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        day: ['2026-05-05','2026-05-06','2026-05-07','2026-05-08','2026-05-09','2026-05-10']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Verify pre-holdout exact-day SHA timestamp and causal guard tests offline
        run: python -m unittest -v research.test_detector_h1h10_binance_week_event_expansion research.test_detector_h1h10_binance_aggtrades_first_verified research.test_detector_h1h10_binance_one_day_event_diagnostics
      - name: Download at most four per-day official Spot/UM price and aggTrades source pairs with publisher SHA and R2 proof
        env:
          H1H10_RESEARCH_DAY: ${{ matrix.day }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python -m research.detector_h1h10_binance_week_event_expansion
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h1h10-exploratory-event-${{ matrix.day }}
          path: detector_h1h10_week_expansion/${{ matrix.day }}.json
          retention-days: 30
          if-no-files-found: warn
