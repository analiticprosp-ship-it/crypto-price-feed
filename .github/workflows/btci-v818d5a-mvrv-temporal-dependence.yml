name: BTCI v8.18d5a MVRV source overlap at 13 26 52 week horizons
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/btci_v818d5a_temporal_dependence.py'
      - '.github/workflows/btci-v818d5a-mvrv-temporal-dependence.yml'
permissions:
  contents: read
jobs:
  chronology-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Compile and temporal-source selftest
        run: |
          python -m py_compile research/btci_v818d5a_temporal_dependence.py
          python research/btci_v818d5a_temporal_dependence.py --self-test
      - name: SHA-pin accepted BTCI source ledger and compute 13/26/52-week source spacing only
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python research/btci_v818d5a_temporal_dependence.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btci-v818d5a-temporal-source-spacing
          path: btci_v818d5a_reports/
          retention-days: 30
