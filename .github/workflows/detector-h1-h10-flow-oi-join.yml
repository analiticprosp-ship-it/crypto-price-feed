name: Detector H1-H10 Flow OI AsOf Join Audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/detector-h1-h10-flow-oi-join.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  join:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Validate R2 source resolution and ZIP safety
        run: python -m unittest -v research.test_detector_h1_h10_r2_source
      - name: Fetch verified R2 input (detector-h1-h10-aggtrades-3day)
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python research/detector_h1_h10_r2_source.py --workflow 'Detector H1-H10 Three-Day Real AggTrades Expansion' --artifact 'detector-h1-h10-aggtrades-3day' --dest 'flow'
      - name: Fetch verified R2 input (detector-h1-h10-masked-sorted-dataset)
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python research/detector_h1_h10_r2_source.py --workflow 'Detector H1-H10 Sorted Masked Dataset' --artifact 'detector-h1-h10-masked-sorted-dataset' --dest 'metrics'
      - name: Inspect inputs and as-of join
        run: |
          ls -lah flow metrics
          python research/detector_h1_h10_flow_oi_join.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detector-h1-h10-flow-oi-asof-join
          path: detector_h1_h10_join_audit/
          retention-days: 30
