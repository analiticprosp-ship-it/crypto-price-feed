name: Detector Historical Feature Audit v2.2
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python research/detector_historical_features_v22.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detector-historical-features-v22-results
          path: detector_historical_features_v22_results/
          retention-days: 30
