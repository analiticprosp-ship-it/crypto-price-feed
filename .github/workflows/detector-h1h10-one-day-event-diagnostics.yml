name: H1H10 Binance May04 Event Only H1 H6 H7 Diagnostics
on:
  push:
    branches: [main]
    paths:
      - 'research/detector_h1h10_binance_one_day_event_diagnostics.py'
      - 'research/test_detector_h1h10_binance_one_day_event_diagnostics.py'
      - '.github/workflows/detector-h1h10-one-day-event-diagnostics.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: h1h10-one-day-event-only-diagnostics
  cancel-in-progress: false
jobs:
  source-descriptive:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Fail-closed offline one-day publication clock, exact SHA, horizon and holdout guards
        run: python -m unittest -v research.test_detector_h1h10_binance_one_day_event_diagnostics
      - name: Independently verify immutable source ZIPs and derived CSVs from R2, summarize event-only H1 H6 H7
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python -m research.detector_h1h10_binance_one_day_event_diagnostics
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h1h10-binance-may04-event-only-diagnostics
          path: detector_h1h10_event_only_diagnostics/summary.json
          retention-days: 30
          if-no-files-found: warn
