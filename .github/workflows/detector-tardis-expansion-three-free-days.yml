name: Detector H1-H10 Tardis Historical Three Additional Free Days
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/detector-tardis-expansion-three-free-days.yml'
      - 'research/detector_tardis_expansion_free_three_days.py'
      - 'research/test_detector_tardis_expansion_free_three_days.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  expand:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Validate isolated three-day sample and vendor cutoff offline
        run: python -m unittest -v research.test_detector_tardis_expansion_free_three_days
      - name: Archive and derive only three new predeclared free Tardis first-of-month days
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python -m research.detector_tardis_expansion_free_three_days
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detector-tardis-three-new-days-manifest
          path: detector_tardis_expansion/report.json
          if-no-files-found: warn
          retention-days: 30
