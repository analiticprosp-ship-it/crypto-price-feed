name: Detector H1-H10 Tardis Earliest Free OI Samples
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/detector-tardis-earliest-free-oi-v1.yml'
      - 'research/detector_tardis_earliest_free_oi_v1.py'
      - 'research/test_detector_tardis_earliest_free_oi_v1.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  earliest-free:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate catalog inception, timestamp and vendor asof gates offline
        run: python -m unittest -v research.test_detector_tardis_earliest_free_oi_v1
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Read first free monthly sample per Tardis venue and asset
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python -m research.detector_tardis_earliest_free_oi_v1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detector-tardis-earliest-free-oi-v1
          path: detector_tardis_earliest_free_day/report.json
          retention-days: 30
