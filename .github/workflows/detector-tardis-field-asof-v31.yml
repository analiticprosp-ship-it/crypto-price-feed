name: Detector Field As-Of Audit v3.1
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python research/detector_tardis_field_asof_v31.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detector-tardis-field-asof-v31-results
          path: detector_tardis_field_asof_v31_results/
          retention-days: 30
