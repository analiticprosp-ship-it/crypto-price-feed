name: Detector Telegram Token Test

on:
  workflow_dispatch:

permissions: {}

jobs:
  telegram-test:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Test Telegram connection
        env:
          BOT_TOKEN: ${{ secrets.DETECTOR_TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.DETECTOR_TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import os
          import urllib.request
          import urllib.parse
          import json

          token = os.environ["BOT_TOKEN"]
          chat_id = os.environ["CHAT_ID"]

          if not token or not chat_id:
              raise SystemExit("Missing Telegram secrets")

          url = f"https://api.telegram.org/bot{token}/sendMessage"
          data = urllib.parse.urlencode({
              "chat_id": chat_id,
              "text": "✅ Detector: новый токен успешно подключён"
          }).encode()

          try:
              with urllib.request.urlopen(url, data=data, timeout=20) as response:
                  result = json.load(response)
              if not result.get("ok"):
                  raise SystemExit("Telegram test failed")
          except Exception:
              raise SystemExit("Telegram connection failed") from None

          print("Telegram test successful")
          PY
