name: Detector Telegram Token Test

on:
  workflow_dispatch:

permissions: {}

jobs:
  telegram-test:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Diagnose Telegram connection
        env:
          BOT_TOKEN: ${{ secrets.DETECTOR_TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.DETECTOR_TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import json
          import urllib.request
          import urllib.parse
          import urllib.error

          token = os.environ.get("BOT_TOKEN", "").strip()
          chat_id = os.environ.get("CHAT_ID", "").strip()

          if not token or not chat_id:
              raise SystemExit("ERROR: Missing secrets")

          if not re.fullmatch(r"\d+:[A-Za-z0-9_-]+", token):
              raise SystemExit("ERROR: Invalid token format")

          def call(method, params=None):
              url = f"https://api.telegram.org/bot{token}/{method}"
              data = urllib.parse.urlencode(params or {}).encode()

              try:
                  with urllib.request.urlopen(
                      url, data=data, timeout=20
                  ) as response:
                      result = json.load(response)

              except urllib.error.HTTPError as e:
                  print(f"{method}: HTTP {e.code}")

                  explanations = {
                      400: "Bad request or invalid chat",
                      401: "Unauthorized - invalid token",
                      403: "Bot blocked or access denied",
                      404: "API endpoint or token not found",
                      429: "Too many requests"
                  }

                  print(explanations.get(e.code, "API error"))
                  raise SystemExit(1) from None

              except Exception as e:
                  print(f"{method}: {type(e).__name__}")
                  raise SystemExit(1) from None

              if not result.get("ok"):
                  raise SystemExit(f"{method}: Failed")

              return result["result"]

          print("STEP 1: Checking bot token")
          bot = call("getMe")

          if bot.get("username", "").lower() != "criptodetector_bot":
              raise SystemExit("ERROR: Token belongs to another bot")

          print("SUCCESS: Correct bot token is valid")

          print("STEP 2: Sending test message")
          call("sendMessage", {
              "chat_id": chat_id,
              "text": "Detector: новый токен успешно подключён"
          })

          print("SUCCESS: Telegram message delivered")
          PY
