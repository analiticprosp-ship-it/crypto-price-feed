name: BTCI price breadth macro four-lens comparison v8.11
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/btci_four_lens_v811.py'
      - '.github/workflows/btci-four-lens-v811.yml'
permissions:
  contents: read
concurrency:
  group: btci-v811-four-lens-research
  cancel-in-progress: false
jobs:
  four-lens:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'boto3>=1.35,<2'
      - name: Reproduce frozen historical BTC, alt-breadth and H4.1 models with shared episodes and 13w future censoring
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python research/btci_four_lens_v811.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btci-v811-common-sample-four-lens
          path: btci_v811_reports/
          retention-days: 30
