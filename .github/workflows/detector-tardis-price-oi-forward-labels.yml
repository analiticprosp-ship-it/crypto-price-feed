name: Detector H1-H10 Tardis Vendor-AsOf Price OI Forward Labels
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/detector-tardis-price-oi-forward-labels.yml'
      - 'research/detector_tardis_price_oi_forward_labels.py'
      - 'research/test_detector_tardis_price_oi_forward_labels.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install S3 dependency
        run: python -m pip install 'boto3>=1.35,<2'
      - name: Offline anti-lookahead, price availability and target leakage tests
        run: python -m unittest -v research.test_detector_tardis_price_oi_forward_labels
      - name: Build four-day vendor-asof research features and separate forward-price labels in R2
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python research/detector_tardis_price_oi_forward_labels.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detector-tardis-price-oi-research-data-report
          path: detector_tardis_price_oi_join/report.json
          if-no-files-found: warn
          retention-days: 30
